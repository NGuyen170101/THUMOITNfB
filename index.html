<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp Mời Tốt Nghiệp</title>
<meta name="description" content="Một lời mời nhỏ cho một cột mốc thật lớn.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Thiệp Mời Tốt Nghiệp">
<meta property="og:description" content="Chạm để mở thiệp. Hẹn gặp bạn trong ngày đặc biệt này.">
<meta property="og:image" content="og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>

<style>
:root{
  --ink:#171717;
  --paper:#f7f3eb;
  --paper2:#eee7da;
  --gold:#b08b45;
  --gold2:#d4b36a;
  --muted:#746d62;
  --line:rgba(176,139,69,.35);
  --ease:cubic-bezier(.22,1,.36,1);
  --flip:cubic-bezier(.3,.55,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 10%,rgba(212,179,106,.18),transparent 28%),
    radial-gradient(circle at 80% 90%,rgba(176,139,69,.16),transparent 30%),
    #d8d0c2;
  min-height:100dvh;display:flex;justify-content:center;align-items:center;
  padding:14px;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.stage{width:430px;max-width:100%;position:relative}
.card{width:430px;position:absolute;top:0;left:0;transform:scale(var(--s,1));transform-origin:top left;perspective:1600px}
.anim .card{transition:transform .9s var(--flip)}
.anim .stage{transition:width .9s var(--flip),height .9s var(--flip)}
.inside{
  position:relative;overflow:hidden;border-radius:28px;
  background:var(--paper);padding:24px 19px 20px;text-align:center;
  display:flex;flex-direction:column;gap:12px;height:var(--cover-h,760px);
  contain:paint;transition:height .9s var(--flip);
}
.bg{
  position:absolute;inset:-8px -8px auto;height:calc(var(--full-h,1180px) + 16px);
  background:url('bg.jpg') center/cover;
  filter:saturate(.72) sepia(.12) blur(1.5px);
  transform:scale(1.06);opacity:.20;transition:transform 2.4s ease-out;
}
.card.open .bg{transform:scale(1)}
.bg-overlay{position:absolute;inset:0 0 auto;height:var(--full-h,1180px);
  background:linear-gradient(180deg,rgba(247,243,235,.72),rgba(247,243,235,.92) 42%,rgba(247,243,235,.98))}
.layer{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;flex:none}

.music{
  position:absolute;top:-6px;right:0;width:30px;height:30px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:12px;z-index:5;box-shadow:0 5px 15px rgba(0,0,0,.18)
}
.music.playing{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.rv{opacity:.01;filter:blur(4px);transform:translateY(14px);transition:opacity .3s ease,filter .3s ease,transform .3s ease}
.card.open .rv{opacity:1;filter:none;transform:none;transition:opacity .7s ease,filter .7s ease,transform .7s var(--ease);transition-delay:calc(var(--d,0)*.09s + .08s)}
.card.settled .rv{will-change:auto}
.rv.nb{filter:none!important;transition-property:opacity,transform}

.kicker{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.title{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;line-height:1.1;margin-top:3px}
.orn{display:flex;align-items:center;justify-content:center;gap:9px;width:76%;margin:10px auto 8px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.orn i:last-child{background:linear-gradient(270deg,transparent,var(--line))}
.orn span{font-size:11px;color:var(--gold)}
.guest-label{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}
.guest{
  display:block;width:90%;margin:2px auto 0;padding:2px 5px 8px;
  text-align:center;font-family:'Playfair Display',serif;font-size:21px;font-weight:600;
  color:var(--ink);background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent) bottom/100% 1px no-repeat;
  border:0;outline:0;cursor:default
}
.lead{margin-top:2px;font-size:11px;font-style:italic;color:var(--muted)}

.hero{
  position:relative;display:flex;align-items:flex-end;min-height:258px;
  margin:3px -19px 0;padding:0 20px 0 0;overflow:hidden;
  border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.15),rgba(255,255,255,.42));
}
.photo{
  position:absolute;left:0;bottom:0;width:196px;height:258px;z-index:1;
  -webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 84%,transparent 100%);
  opacity:.01;transform:translateX(-30px) scale(1.03);filter:blur(4px);
  transition:opacity .3s ease,transform .3s ease,filter .3s ease;
}
.card.open .photo{opacity:1;transform:none;filter:none;transition:opacity 1s var(--ease) .2s,transform 1s var(--ease) .2s,filter 1s var(--ease) .2s}
.photo img{width:100%;height:100%;object-fit:contain;object-position:left bottom;display:block;filter:drop-shadow(0 10px 13px rgba(0,0,0,.18))}
.info{position:relative;z-index:3;margin-left:auto;width:52%;padding:0 2px 42px 4px;text-align:right}
.badge{
  display:inline-block;margin-bottom:7px;padding:4px 10px;border-radius:30px;
  background:var(--ink);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase
}
.name{font-family:'Playfair Display',serif;font-size:25px;font-weight:600;line-height:1.1;margin-bottom:5px;white-space:nowrap}
.major{font-size:10px;font-weight:600;color:#625b50;line-height:1.4}
.major::first-letter{text-transform:uppercase}
.lead2{font-size:10px}
.thanks{
  padding:14px 16px;font-family:'Playfair Display',serif;font-size:13px;line-height:1.65;
  font-style:italic;color:#554d42;border:1px solid var(--line);border-radius:16px;
  background:rgba(255,255,255,.42)
}

.section-label{
  font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:1px
}
.stack{position:relative;width:164px;height:190px;margin:2px auto 0}
.pol{
  position:absolute;inset:0;padding:8px 8px 29px;background:#fff;border:1px solid #e5dfd4;
  border-radius:5px;box-shadow:0 9px 25px rgba(30,25,18,.18);transform:rotate(var(--r,0deg));
  transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .5s;user-select:none
}
.pol img{width:100%;height:138px;object-fit:cover;border-radius:2px;display:block;background:#eee8dc}
.pol span{display:block;margin-top:6px;font-family:'Playfair Display',serif;font-size:10px;font-style:italic;color:#665e52}
.pol.fly{transform:translate(150px,-50px) rotate(35deg) scale(.9);opacity:0;pointer-events:none}
.hint{font-size:9px;font-style:italic;color:#918879;margin-top:2px}

.cd-cap{font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cd{
  display:flex;justify-content:center;gap:5px;padding:9px 8px;border:1px solid var(--line);
  border-radius:16px;background:rgba(255,255,255,.36)
}
.cd div{flex:1;max-width:68px;padding:5px 4px;border-radius:10px;background:rgba(255,255,255,.45)}
.cd b{display:block;font-family:'Playfair Display',serif;font-size:17px;font-weight:600}
.cd small{font-size:7.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.cd .cd-done{flex:none;max-width:none;background:none;font-size:11px;font-weight:700;color:var(--gold)}

.details{
  padding:13px 14px;text-align:left;font-size:10.5px;line-height:1.45;color:#3f3a33;
  display:grid;gap:9px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.38)
}
.details .row{display:flex;gap:10px}
.details .ico{font-size:14px;line-height:1.2}
.details em{display:block;font-style:normal;font-size:8px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);margin-bottom:1px}

.wish{
  padding:12px;text-align:left;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.38)
}
.wish-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px}
.wish-head strong{font-size:10px}
.react{display:inline-flex;gap:4px}
.react button{padding:3px 8px;border:1px solid #ddd3c4;border-radius:14px;background:rgba(255,255,255,.75);font-size:10px}
.wish-form{display:flex;gap:6px}
.wish-form input{flex:1;min-width:0;padding:6px 9px;border:1px solid #d8cdbd;border-radius:9px;background:rgba(255,255,255,.8);font-size:16px;outline:0}
.wish-form button{padding:6px 15px;border-radius:9px;background:var(--ink);color:#fff;font-size:10px;font-weight:700}
.feed{max-height:64px;overflow-y:auto;margin-top:6px;display:grid;gap:3px}
.feed div{padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.65);font-size:10px;color:#4b453d}

.actions{display:grid;grid-template-columns:2fr 1fr;gap:7px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:11px 6px;border-radius:22px;
  font-size:10.5px;font-weight:700;text-decoration:none;text-align:center;line-height:1.2;
  background:var(--ink);color:#fff;transition:transform .15s
}
.btn:active{transform:scale(.97)}
.btn.alt{background:rgba(255,255,255,.75);color:#4b453d;border:1px solid #d8cdbd}
.contact{font-size:9.5px;font-style:italic;color:#918879;text-align:right;padding-right:4px;margin-top:5px}
.contact a{color:inherit}

.cover{
  position:absolute;inset:0;z-index:10;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.7);
  text-align:center;background:
    radial-gradient(circle at 18% 15%,rgba(255,255,255,.16),transparent 28%),
    radial-gradient(circle at 82% 82%,rgba(212,179,106,.18),transparent 35%),
    linear-gradient(145deg,#161616,#292722 55%,#171717);
  box-shadow:0 28px 65px rgba(28,24,18,.34);transform-origin:left center;will-change:transform,opacity;
  backface-visibility:hidden;transition:transform .9s var(--flip),opacity .3s ease,visibility 0s
}
.card.open .cover{
  transform:rotateY(-145deg);opacity:0;pointer-events:none;visibility:hidden;
  transition:transform .9s var(--flip),opacity .5s ease .25s,visibility 0s .9s
}
.cover::before{
  content:"";position:absolute;inset:7%;border:1px solid rgba(212,179,106,.5);border-radius:22px;pointer-events:none
}
.cover::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:50%;left:50%;
  transform:translate(-50%,-50%);border:1px dashed rgba(212,179,106,.3);pointer-events:none
}
.cover-inner{
  position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;padding:38px 24px
}
.cover .invite{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#d8c49a}
.cover h1{
  font-family:'Playfair Display',serif;color:#f8f4eb;margin:7px 0 3px;font-size:40px;font-weight:600;
  letter-spacing:.5px;line-height:1.05
}
.cover .year{font-size:12px;font-weight:700;letter-spacing:6px;text-indent:6px;color:#d4b36a}
.logo{width:86px;height:86px;border-radius:50%;overflow:hidden;border:1px solid rgba(212,179,106,.65);box-shadow:0 12px 30px rgba(0,0,0,.3);background:#fff}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.cover .sub{max-width:270px;font-family:'Playfair Display',serif;font-size:12px;font-style:italic;line-height:1.55;color:#c8c0b1}
.open-btn{
  width:78%;padding:13px;border:1px solid rgba(212,179,106,.75);border-radius:30px;
  background:rgba(255,255,255,.05);color:#f8f4eb;font-size:10px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;box-shadow:0 12px 28px rgba(0,0,0,.25);animation:pulse 1.8s var(--ease) infinite
}
@keyframes pulse{50%{transform:scale(1.035) translateY(-2px)}}
.card.open .cover *{animation-play-state:paused!important}

.touch-star{position:fixed;pointer-events:none;font-size:15px;z-index:9999;animation:float 1s ease-out forwards}
@keyframes float{from{transform:translate(-50%,-50%) scale(.5);opacity:1}to{transform:translate(-50%,-60px) scale(1.3);opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9998}

.admin{
  display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:99999;
  width:calc(100% - 24px);max-width:430px;padding:11px 12px;border-radius:15px;color:#fff;
  background:rgba(23,23,23,.97);border:1px solid rgba(212,179,106,.35);box-shadow:0 12px 30px rgba(0,0,0,.45)
}
.admin-head{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#cfc6b6}
.admin-row{display:flex;gap:6px}
.admin input,.admin textarea{flex:1;min-width:0;padding:7px 10px;border-radius:8px;border:1px solid #514b42;background:#24231f;color:#fff;font-size:16px;outline:0}
.admin textarea{width:100%;height:84px;resize:vertical;margin-top:6px;display:none}
.admin.bulk textarea{display:block}
.admin button.a{padding:7px 12px;border-radius:8px;background:#b08b45;color:#fff;font-size:10px;font-weight:800;white-space:nowrap}
.admin button.a.ok{background:#4d8b62}
.admin .link{margin-top:6px;font-size:10px;color:#cfc6b6;background:none;text-decoration:underline}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>

<body>
<audio id="bgMusic" loop preload="none"></audio>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="stage" id="stage">
<main class="card" id="card">

<button class="cover" id="cover" type="button" aria-label="Chạm để mở thiệp">
  <div class="cover-inner">
    <div>
      <div class="invite">Một lời mời cho một cột mốc</div>
      <h1>Lễ Tốt Nghiệp</h1>
      <div class="year" data-k="year"></div>
    </div>
    <div class="logo"><img src="logo.png" alt="Logo trường"></div>
    <p class="sub">“Có những ngày chỉ đến một lần — và ngày hôm ấy, thật vui nếu có bạn ở bên.”</p>
    <div class="open-btn">Chạm để mở thiệp</div>
  </div>
</button>

<section class="inside" id="inside">
  <div class="bg"></div><div class="bg-overlay"></div>
  <div class="layer">
    <button class="music" id="musicBtn" type="button" title="Bật/Tắt nhạc" aria-label="Bật/Tắt nhạc">🎵</button>

    <header class="rv" style="--d:0">
      <div class="kicker">Trân trọng kính mời</div>
      <div class="title">Lễ Tốt Nghiệp</div>
      <div class="orn" aria-hidden="true"><i></i><span>✦</span><i></i></div>
      <div class="guest-label">Thân mời</div>
      <input class="guest" id="guest" type="text" maxlength="40" aria-label="Tên khách mời" readonly tabindex="-1">
      <p class="lead" data-k="lead"></p>
    </header>

    <div class="hero">
      <div class="photo"><img id="portrait" alt="Ảnh tân cử nhân"></div>
      <div class="info rv" style="--d:1">
        <span class="badge">The Graduate</span>
        <div class="name" id="name"></div>
        <div class="major">Chuyên ngành <span data-k="major"></span></div>
      </div>
    </div>

    <p class="thanks rv nb" style="--d:2" data-k="thanks"></p>

    <div class="rv" style="--d:3">
      <div class="section-label">Những ngày đáng nhớ</div>
      <div class="stack" id="stack" role="button" tabindex="0" aria-label="Lật ảnh tiếp theo"></div>
      <div class="hint">Chạm vào ảnh để xem khoảnh khắc tiếp theo</div>
    </div>

    <div class="rv nb" style="--d:4">
      <div class="cd-cap">Đếm ngược đến ngày gặp nhau</div>
      <div class="cd" id="cd">
        <div><b id="d">00</b><small>Ngày</small></div>
        <div><b id="h">00</b><small>Giờ</small></div>
        <div><b id="m">00</b><small>Phút</small></div>
        <div><b id="s">00</b><small>Giây</small></div>
      </div>
    </div>

    <div class="details rv nb" style="--d:4">
      <div class="row"><span class="ico">🕰️</span><div><em>Thời gian</em><span id="when"></span></div></div>
      <div class="row"><span class="ico">📍</span><div><em>Địa điểm</em><span data-k="venue"></span>, <span data-k="address"></span></div></div>
    </div>

    <div class="wish rv nb" style="--d:5">
      <div class="wish-head">
        <strong>Để lại một lời chúc nhé</strong>
        <span class="react">
          <button type="button" data-react="heart">❤️ <span id="heart">0</span></button>
          <button type="button" data-react="cap">🎓 <span id="capn">0</span></button>
        </span>
      </div>
      <form class="wish-form" id="wishForm">
        <input id="wishInput" maxlength="140" autocomplete="off" aria-label="Lời chúc">
        <button type="submit">Gửi</button>
      </form>
      <div class="feed" id="feed" aria-live="polite"></div>
    </div>

    <footer class="rv" style="--d:5">
      <div class="actions">
        <a class="btn" id="mapBtn" target="_blank" rel="noopener">🗺️ Chỉ đường</a>
        <button class="btn alt" id="closeBtn" type="button">Đóng thiệp</button>
      </div>
      <p class="contact">Liên hệ: <a id="tel"></a></p>
    </footer>
  </div>
</section>
</main>
</div>

<div class="admin" id="admin">
  <div class="admin-head"><span>🔗 Tạo link mời riêng</span><button type="button" id="adminX" aria-label="Đóng" style="color:#cfc6b6">✕</button></div>
  <div class="admin-row">
    <input id="aName" placeholder="Tên khách (VD: Chị Lan)...">
    <button class="a" id="aCopy" type="button">Copy link</button>
  </div>
  <textarea id="aBulk" placeholder="Mỗi dòng một tên khách..."></textarea>
  <button class="link" id="aToggle" type="button">Tạo hàng loạt</button>
</div>

<script>
const CONFIG = {
  /* --- Thông tin tân cử nhân --- */
  graduate:  'Lê Trọng Nguyễn',   // Họ tên đầy đủ (hiện ở mục "Tân Cử Nhân"; dài quá chữ tự nhỏ lại cho vừa 1 dòng)
  firstName: 'Nguyễn',            // Tên gọi ngắn (dùng trong ô gợi ý "Gửi lời chúc đến ...")
  major:     'Luật Kinh Tế',      // Chuyên ngành
  year:      2027,                // Năm (hiện ở bìa)

  /* --- Thời gian & địa điểm --- */
  start:   '2027-11-21T09:30:00+07:00',   // Giờ bắt đầu: AAAA-TT-NNTGG:PP:00+07:00 (+07:00 = giờ Việt Nam). Đếm ngược & dòng "Thời gian" lấy từ đây
  venue:   'Nhà Hát Hòa Bình',            // Tên địa điểm
  address: '240 Đường 3/2, Hòa Hưng, TP.HCM',
  mapUrl:  'https://maps.app.goo.gl/aqQmzZK9TjaQgQw47',   // Link Google Maps cho nút "Xem bản đồ"
  phone:     '0909123456',        // Số điện thoại dạng liền (dùng để gọi)
  phoneText: '0909 123 456',      // Số hiển thị trên thiệp

  /* --- Câu chữ --- */
  defaultGuest: 'Quý Anh Chị / Bạn Bè',   // Tên hiện khi link KHÔNG có ?khach=...
  lead:   'đến tham dự lễ tốt nghiệp của', // Câu nối giữa tên khách và tên tân cử nhân
  thanks: '"Sự hiện diện của bạn là niềm vinh hạnh lớn, đánh dấu cột mốc ý nghĩa trên chặng đường mới của mình. Chân thành cảm ơn bạn vì luôn đồng hành!"',

  /* --- Hình ảnh (đặt file cạnh index.html, hoặc dán link ảnh đầy đủ) --- */
  portrait: 'portrait.png',       // ẢNH CHÂN DUNG TÁCH NỀN: PNG nền trong suốt, tỉ lệ 3:4 (vd 660×880), cắt từ đầu đến ngực
  photos: [                       // Xấp ảnh polaroid — thêm/bớt dòng tùy ý (nên 3–5 ảnh)
    { src: 'portrait.jpg', cap: 'Ngày đầu nhập trường' },
    { src: 'bg.jpg',       cap: 'Khuôn viên trường' },
    { src: 'portrait.jpg', cap: 'Mùa tốt nghiệp 2027' }
  ],
  // Các file khác trong thư mục: logo.png (logo ở bìa), bg.jpg (ảnh nền thiệp), og.jpg (ảnh xem trước khi gửi link)

  /* --- Nhạc & rung --- */
  music: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3',
                                  // Link nhạc. Ổn định nhất: tải file về repo, đặt tên music.mp3 rồi ghi 'music.mp3'. Để '' = không nhạc
  musicVolume:  0.6,              // Âm lượng tối đa 0–1 (nhạc tự tăng dần khi mở thiệp). iPhone luôn dùng âm lượng máy
  preloadMusic: true,             // true = tải sẵn nhạc lúc rảnh cho lần mở đầu mượt (tốn vài MB 4G). false = chỉ tải khi mở
  vibrate:      true,             // true = rung nhẹ khi mở thiệp / thả tim (chỉ Android)

  /* --- Nhận lời chúc & tim về Google Sheet (xem hướng dẫn Code.gs). Để '' = không gửi đi đâu --- */
  wishEndpoint: '',               // URL Web app Apps Script (kết thúc bằng /exec)
  token: 'doi-chuoi-bi-mat-cua-ban'   // Phải trùng TOKEN trong Code.gs
};

const DESIGN_W=430, COVER_H=760, MAX_SCALE=1.5;
const CONFETTI_OPEN={particleCount:55,spread:60,startVelocity:32,origin:{y:.62}};

const $=id=>document.getElementById(id);
const card=$('card'),stage=$('stage'),guestEl=$('guest');
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const pad=n=>String(n).padStart(2,'0');
const startAt=new Date(CONFIG.start);
const buzz=p=>{if(CONFIG.vibrate)try{navigator.vibrate&&navigator.vibrate(p)}catch{}};

function fitText(el,max,min){
  let fs=max;el.style.fontSize=fs+'px';
  while(el.scrollWidth>el.clientWidth&&fs>min)el.style.fontSize=(--fs)+'px';
}

document.documentElement.style.setProperty('--cover-h',COVER_H+'px');
let fullH=COVER_H;
const INSIDE_PAD=44;
function measureFull(){
  fullH=Math.max(card.querySelector('.layer').offsetHeight+INSIDE_PAD,COVER_H);
  document.documentElement.style.setProperty('--full-h',fullH+'px');
  return fullH;
}
function fitScale(){
  const open=card.classList.contains('open');
  let s=Math.min(MAX_SCALE,(document.documentElement.clientWidth-28)/DESIGN_W);
  if(!open)s=Math.min(s,(innerHeight-28)/COVER_H);
  card.style.setProperty('--s',s);
  stage.style.width=DESIGN_W*s+'px';
  stage.style.height=(open?fullH:COVER_H)*s+'px';
}
addEventListener('resize',fitScale);
if('ResizeObserver' in window)new ResizeObserver(()=>{measureFull();fitScale()}).observe(card);

document.querySelectorAll('[data-k]').forEach(el=>el.textContent=CONFIG[el.dataset.k]);
$('name').textContent=CONFIG.graduate;
$('portrait').src=CONFIG.portrait;
$('mapBtn').href=CONFIG.mapUrl;
$('tel').href='tel:'+CONFIG.phone;
$('tel').textContent=CONFIG.phoneText;
$('wishInput').placeholder='Gửi lời chúc đến '+CONFIG.firstName+'...';
$('when').textContent=new Intl.DateTimeFormat('vi-VN',{
  timeZone:'Asia/Ho_Chi_Minh',weekday:'long',day:'2-digit',month:'2-digit',year:'numeric',
  hour:'2-digit',minute:'2-digit',hourCycle:'h23'
}).format(startAt).replace(',',' —');

const params=new URLSearchParams(location.search);
const cleanName=raw=>raw.trim().slice(0,40);
const guestName=cleanName(params.get('khach')||'');
guestEl.value=guestName||CONFIG.defaultGuest;
const fitAll=()=>{fitText($('name'),25,12);fitText(guestEl,21,12);measureFull();fitScale()};
fitAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
addEventListener('load',fitAll);

if(params.get('admin')==='1')$('admin').style.display='block';
const baseUrl=location.origin+location.pathname;
const inviteUrl=name=>name?`${baseUrl}?khach=${encodeURIComponent(name)}`:baseUrl;
async function copy(text){
  try{await navigator.clipboard.writeText(text)}
  catch{
    const t=Object.assign(document.createElement('textarea'),{value:text});
    document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
}
$('aName').addEventListener('input',e=>{
  guestEl.value=cleanName(e.target.value)||CONFIG.defaultGuest;
  fitText(guestEl,21,12);
});
$('aToggle').onclick=()=>{
  const bulk=$('admin').classList.toggle('bulk');
  $('aToggle').textContent=bulk?'Tạo từng link':'Tạo hàng loạt';
  $('aCopy').textContent=bulk?'Copy tất cả':'Copy link';
};
$('aCopy').onclick=async()=>{
  const btn=$('aCopy');
  const text=$('admin').classList.contains('bulk')
    ?$('aBulk').value.split('\n').map(s=>s.trim()).filter(Boolean).map(n=>`${n}: ${inviteUrl(n)}`).join('\n')
    :inviteUrl($('aName').value.trim());
  if(!text)return;
  const label=btn.textContent;
  await copy(text);
  btn.textContent='Đã copy!';btn.classList.add('ok');
  setTimeout(()=>{btn.textContent=label;btn.classList.remove('ok')},1800);
};
$('adminX').onclick=()=>$('admin').style.display='none';

function send(data){
  if(!CONFIG.wishEndpoint)return;
  const body=JSON.stringify({token:CONFIG.token,guest:guestName||'(không tên)',...data});
  try{fetch(CONFIG.wishEndpoint,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body}).catch(()=>{})}catch{}
}
const pend={hearts:0,caps:0};let pendTimer;
function flushReacts(){
  clearTimeout(pendTimer);
  if(!pend.hearts&&!pend.caps)return;
  send({kind:'react',...pend});pend.hearts=pend.caps=0;
}
function queueReact(type){
  pend[type==='heart'?'hearts':'caps']++;
  clearTimeout(pendTimer);pendTimer=setTimeout(flushReacts,2000);
}
addEventListener('pagehide',flushReacts);

let fx=null;
function getFx(){
  if(fx||!window.confetti)return fx;
  try{fx=confetti.create($('fx'),{resize:true,useWorker:true})}catch{fx=confetti}
  return fx;
}

const audio=$('bgMusic'),musicBtn=$('musicBtn');
let musicOn=store.get('musicOn',true),fadeTimer,resumeAfterHide=false;
if(!CONFIG.music)musicBtn.hidden=true;
musicBtn.textContent=musicOn?'🎵':'🔇';
audio.addEventListener('error',()=>musicBtn.hidden=true);

function fadeTo(target,ms,done){
  clearInterval(fadeTimer);
  const from=audio.volume,steps=Math.max(1,ms/50);let i=0;
  fadeTimer=setInterval(()=>{
    audio.volume=Math.min(1,Math.max(0,from+(target-from)*(++i/steps)));
    if(i>=steps){clearInterval(fadeTimer);if(done)done()}
  },50);
}
function playMusic(){
  if(!audio.src)audio.src=CONFIG.music;
  audio.volume=0;
  audio.play().then(()=>{
    musicBtn.classList.add('playing');musicBtn.textContent='🎵';fadeTo(CONFIG.musicVolume,2500)
  }).catch(()=>{});
}
function stopMusic(){fadeTo(0,500,()=>audio.pause());musicBtn.classList.remove('playing');musicBtn.textContent='🔇'}
musicBtn.onclick=e=>{
  e.stopPropagation();musicOn=audio.paused;store.set('musicOn',musicOn);musicOn?playMusic():stopMusic();
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    flushReacts();
    if(!audio.paused){resumeAfterHide=true;audio.pause();musicBtn.classList.remove('playing')}
  }else if(resumeAfterHide){
    resumeAfterHide=false;audio.play().then(()=>musicBtn.classList.add('playing')).catch(()=>{});
  }
});

let isOpen=false,settleTimer;
function openCard(){
  if(isOpen)return;
  isOpen=true;
  const inside=$('inside');
  document.body.classList.add('anim');
  card.classList.add('open');
  inside.style.height=measureFull()+'px';
  fitScale();
  if(CONFIG.music&&musicOn)playMusic();
  buzz([15,30,15]);
  setTimeout(()=>{
    const f=CONFETTI_OPEN.particleCount>0&&isOpen&&getFx();
    if(f)f(CONFETTI_OPEN);
  },450);
  setTimeout(()=>{
    if(!store.get('opened',false)){store.set('opened',true);send({kind:'open'})}
  },1500);
  clearTimeout(settleTimer);
  settleTimer=setTimeout(()=>{
    card.classList.add('settled');
    if(isOpen)inside.style.height='auto';
  },3000);
}
function closeCard(){
  if(!isOpen)return;
  isOpen=false;
  const inside=$('inside');
  clearTimeout(settleTimer);
  card.classList.remove('open','settled');
  inside.style.height=inside.offsetHeight+'px';
  void inside.offsetHeight;
  inside.style.height=COVER_H+'px';
  fitScale();
  window.scrollTo({top:0,behavior:'smooth'});
}
$('cover').onclick=openCard;
$('closeBtn').onclick=closeCard;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});

function warmUp(){
  ['bg.jpg',CONFIG.portrait,...CONFIG.photos.map(p=>p.src)].forEach(src=>{
    const im=new Image();im.src=src;if(im.decode)im.decode().catch(()=>{});
  });
  getFx();
  if(CONFIG.music&&CONFIG.preloadMusic&&!audio.src){audio.preload='auto';audio.src=CONFIG.music}
}
addEventListener('load',()=> (window.requestIdleCallback||(f=>setTimeout(f,800)))(warmUp,{timeout:4000}));

$('inside').addEventListener('click',e=>{
  if(e.target.closest('button,a,input,form,.stack'))return;
  const s=document.createElement('div');
  s.className='touch-star';s.textContent=['✦','✧','🎓','✨'][Math.floor(Math.random()*4)];
  s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.style.visibility='hidden'},true);

const stack=$('stack');
const tilt=['-4deg','3deg','-2deg'];
CONFIG.photos.slice().reverse().forEach(p=>{
  const f=document.createElement('figure');f.className='pol';
  f.innerHTML='<img alt=""><span></span>';
  f.firstChild.src=p.src;f.lastChild.textContent=p.cap;stack.appendChild(f);
});
function layoutStack(){[...stack.children].forEach((c,i)=>{c.style.zIndex=i+1;c.style.setProperty('--r',tilt[i%3])})}
function nextPolaroid(){
  const top=stack.lastElementChild;if(!top||top.classList.contains('fly'))return;
  top.classList.add('fly');
  setTimeout(()=>{top.classList.remove('fly');stack.prepend(top);layoutStack()},450);
}
layoutStack();stack.onclick=nextPolaroid;
stack.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nextPolaroid()}};

(function tick(){
  const diff=startAt-Date.now();
  if(diff<=0){
    $('cd').innerHTML='<div class="cd-done">🎓 Ngày đặc biệt đã đến — hẹn gặp bạn!</div>';return;
  }
  const sec=Math.floor(diff/1000);
  if(!document.hidden){
    $('d').textContent=pad(Math.floor(sec/86400));
    $('h').textContent=pad(Math.floor(sec%86400/3600));
    $('m').textContent=pad(Math.floor(sec%3600/60));
    $('s').textContent=pad(sec%60);
  }
  setTimeout(tick,1000-Date.now()%1000);
})();

const counts=store.get('reacts',{heart:0,cap:0});
const showCounts=()=>{$('heart').textContent=counts.heart;$('capn').textContent=counts.cap};
showCounts();
document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{
  counts[b.dataset.react]++;store.set('reacts',counts);showCounts();queueReact(b.dataset.react);buzz(12);
  const f=getFx();
  if(f){
    const r=b.getBoundingClientRect();
    f({particleCount:14,spread:50,scalar:.8,startVelocity:22,
      origin:{x:(r.left+r.width/2)/innerWidth,y:r.top/innerHeight},
      shapes:['circle'],colors:b.dataset.react==='heart'?['#f43f5e','#fb7185']:['#b08b45','#d4b36a']});
  }
});

const wishes=store.get('wishes',[]);
function renderWish(w){
  const row=document.createElement('div'),who=document.createElement('b');
  who.textContent=w.name+': ';row.append(who,document.createTextNode(w.text));$('feed').prepend(row);
}
wishes.forEach(renderWish);
$('wishForm').onsubmit=e=>{
  e.preventDefault();
  const text=$('wishInput').value.trim().slice(0,140);if(!text)return;
  const w={name:guestName||'Khách mời',text};
  wishes.push(w);store.set('wishes',wishes.slice(-30));renderWish(w);$('wishInput').value='';send({kind:'wish',text});
};
</script>
</body>
</html>
